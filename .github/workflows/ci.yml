name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check notes and types
        run: npm run check

      - name: Build plugin and CLI
        run: npm run build

      - name: Check example notes with the built CLI
        run: node packages/cli/dist/cli.cjs check example-vault/*.md packages/cli/skill/writing-openui-notes/templates/*.md

      - name: Audit dependencies
        run: npm audit --audit-level=high
